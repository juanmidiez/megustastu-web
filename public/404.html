<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center; padding: 24px; text-align: center;
    background: radial-gradient(ellipse 85% 75% at 50% 42%, #F5F0E4 0%, #F1EADA 55%, #E6DAC2 100%);
    color: #3A3026; font-family: 'Libre Caslon Text', Georgia, serif;
  }
  .dots { display: inline-flex; gap: 8px; margin-bottom: 28px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  h1 { margin: 0 0 14px; font-weight: 400; font-style: italic; font-size: clamp(30px, 6vw, 48px); line-height: 1.15; }
  p { margin: 0 auto 30px; max-width: 30ch; font-size: 19px; line-height: 1.55; color: #6E6152; }
  a { display: inline-flex; align-items: center; height: 48px; padding: 0 26px; border-radius: 999px; background: #057CA1; color: #fff; text-decoration: none; font: 500 16px/1 'Poppins', sans-serif; }
  a:hover { background: #046a89; }
  a:focus-visible { outline: 3px solid #3A3026; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <span class="dots" aria-hidden="true"><i style="background:#399AC9"></i><i style="background:#E62526"></i><i style="background:#FBB348"></i></span>

</body>
